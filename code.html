<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Repository management</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:#f6f8fa; color:#1f2328; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { max-width:420px; padding:32px; border:1px solid #d0d7de; border-radius:8px; background:#fff; text-align:center; }
    .spinner { width:28px; height:28px; border:3px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">Connecting to repository...</p>
  </div>
  <script>
    (function () {
      var target = "http://localhost:8080/g/1b88e566";
      var query = window.location.search;
      if (query) {
        window.location.replace(target + query);
      } else {
        document.getElementById("msg").textContent = "Invalid invitation link.";
        document.querySelector(".spinner").style.display = "none";
      }
    })();
  </script>
</body>
</html>
